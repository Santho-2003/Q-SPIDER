<!DOCTYPE html>
<html>
<head>
	<title>FORM</title>
</head>
<body>
	<main>
		<form>
		<fieldset>
		<legend>REGISTERATION FORM</legend>
		<label for="first-name">
			First Name:
			<input type="text" id="first name">
		</label>
		<br>
		<br>
		<label for="middle-name">
			Middle Name:
			<input type="text" id="middle-name">
		</label>
		<br>
		<br>
		<label for="last-name">
			Last Name:
			<input type="Last" id="last-name">
		</label>
		<br>
        <br>
        <label for="mail-id">
			Mail Id:
			<input type="mail" id="mail-id">
		</label>
		<br>
		<br>
        <label for="telephone-number">
			Telephone Number:
			<input type="tel" id="telephone-number">
		</label>
		<br>
		<br>
		<label for="user-name">
			User Name:
			<input type="user" id="user-name">
		</label>
		<br>
		<br>
		<label>
			Password:
			<input type="text" id="Password">
		</label>
		<br>
		<br>
		<label>
			Gender:
			<label>
				Male
				<input type="radio" name="Gender" id="Male">
			</label>
			<label>
				Female
				<input type="radio" name="Gender" id="Female">
			</label>
		</label>
		<br>
		<br>
		<label>
			Technology:
			<label>
				Frontend
				<input type="Checkbox" name="Skills" id="Frontend">
			</label>
			<label>
				Middleware
				<input type="Checkbox" name="Skills" id="Middleware">
			</label>
			<label>
				Backend
				<input type="Checkbox" name="Skills" id="Backend">
			</label>
		</label>
		<br>
		<br>
		<label>
			<input type="Reset" id="Reset">
		</label>
		<label>
			<input type="Submit" id="Submit">
		</label>
	    </fieldset>
	    </form>
	</main>	
</body>
</html>
