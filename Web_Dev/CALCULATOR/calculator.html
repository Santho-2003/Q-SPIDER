                width: 250px;

    <body>
        <h1 style="text-align: center;">SIMPLE CALCULATOR</h1>
        <div id="main" style="text-align: center;">
            <div style="grid-area:TWENTYFIVE;" id="A">25</div>
            <div style="grid-area:CLEAR;" id="b">clear</div>
            <div style="grid-area: MINUS;" id="c">-</div>
            <div style="grid-area: PLUS" id="d">+</div>
            <div style="grid-area: SEVEN;" id="e">7</div>
            <div style="grid-area: EIGHT;" id="f">8</div>
            <div style="grid-area: NINE;" id="g">9</div>
            <div style="grid-area: SLASH;" id="h">/</div>
            <div style="grid-area: FOUR;" id="i">4</div>
            <div style="grid-area: FIVE;" id="j">5</div>
            <div style="grid-area: SIX;" id="k">6</div>
            <div style="grid-area: X;" id="l">X</div>
            <div style="grid-area: ONE;"id="m">1</div>
            <div style="grid-area: TWO;" id="n">2</div>
            <div style="grid-area: THREE;" id="o">3</div>
            <div style="grid-area: ZERO;" id="p">0</div>
            <div style="grid-area: DOT;" id="q">.</div>
            <div style="grid-area: EQUAL" id="r">=</div>
        </div>
