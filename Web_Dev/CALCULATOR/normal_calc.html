<!DOCTYPE html>
<html>
<head>
    <style>
        #main{
            background-color: rgb(204, 37, 143);
            margin: 20px;
            padding: 5px;
            display: grid;
            grid-template-columns: auto auto auto;
            width:400px;
            margin-left: 450px;
        }
        #main>div{
            background-color: rgba(190, 224, 36, 0.831);
            margin: 2px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="main">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>*</div>
        <div>0</div>
        <div>#</div>
    </div>
</body>
</html>
