<!DOCTYPE html>
<html>
<head>
	<title>HTML forms</title>
</head>
<body>
	<main>
		<h1>FORMS</h1>
		<fieldset>
			<legend>HTML FORMS</legend>
			<label>
				USERNAME:
				<input type="text" id="username">
			</label>
			<br>
			<br>
			<label>
				PASSWORD:
				<input type="text" id="Password">
			</label>
			<br>
			<br>
			<label>
				PHONE NUMBER:
				<input type="text" id="Phone  Number">
			</label>
			<br>
			<br>
			<label>
				DOB:
				<input type="date" id="DOB" placeholder="dd-mm-yyyy">
			</label>
			<br>
			<br>
			<label>
				EMAILID:
				<input type="text" id="Email-id">
			</label>
			<br>
			<br>
			<label>
				HOBBIES:
				<label>
					Gardening
					<input type="checkbox" name="HOBBIES" id="Gardening">
				</label>
				<label>
					Painting
					<input type="checkbox" name="HOBBIES" id="Paining">
				</label>
				<label>
					Cricket
					<input type="checkbox" name="HOBBIES" id="Cricket">
				</label>
				<label>
					Music
					<input type="checkbox" name="HOBBIES" id="Music">
				</label>
			</label>
			<br>
			<br>
			<label>
				GENDER:
				<label>
					<input type="radio" name="GENDER" id="Male">
					Male
				</label>
				<label>
					<input type="radio" name="GENDER" id="Female">
					Female
				</label>
				<label>
					<input type="radio" name="GENDER" id="Others">
					Others
				</label>
			</label>
			<br>
			<br>
			<label>
				PRICE RANGE:
				<input type="range" id="PRICE RANGE">
			</label>
			<br>
			<br>
			<label>
				CHOOSE BACKGROUND COLOR:
				<input type="color" id="Background-color">
			</label>
			<br>
			<br>
			<label>
				WEBSITE URL:
				<input type="" name="">
			</label>
			<br>
			<br>
			<label>
				PERMANENT ADDRESS*:
				<textarea id="permanent address">
				</textarea>
			</label>
		</fieldset>
		<br>
		<label>
			<input type="submit" id="submit">
		</label>
		<label>
			<input type="reset" id="reset">
		</label>
		<label>
			<input type="Submit" id="reset">
		</label>
	</main>
</body>
</html>
