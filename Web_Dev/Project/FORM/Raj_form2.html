<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FORM</title>
	<style>
	h4{
      color: magenta;
	}
	</style>
</head>
<body>
	<main>
		<h2>ZOO KEEPER APPLICATION FORM</h2>
		<h4>Please complete the form, mandatory fields are marked with a*</h4>
	</main>
	<fieldset>
		<legend>CONTACT DETAILS</legend>
		<label>
			NAME:
			<input type="text">
		</label>
        <br>
        <br>
        <label>
        	TELEPHONE:
        	<input type="text">
        </label>
        <br>
        <br>
        <label>
        	EMAIL:
        	<input type="text">
        </label>
	</fieldset>
	<br>
	<br>
	<fieldset>
		<legend>PERSONAL INFORMATION</legend>
		<label>
			AGE:
			<input type="text">
		</label>
		<br>
        <br>
        <label>
        	GENDER:
        	<select>
        		<option>Female</option>
        		<option>Male</option>
        		<option>Other</option>
        	</select>
        </label>
	</fieldset>
	<br>
	<br>
	<fieldset>
		<legend>PICK YOUR FAVOURITE ANIMALS</legend>
		<label>
			<input type="checkbox" name="Zebra" id="Zebra">
		Zebra
		</label>
		<label>
			<input type="checkbox" name="Cat" id="Cat">
		Cat
		</label>
		<label>
			<input type="checkbox" name="Anaconda" id="Anaconda">
		Anaconda
		</label>
		<label>
			<input type="checkbox" name="Human" id="Human">
		Human
		</label>
		<br>
		<br>
		<label>
			<input type="checkbox" name="Elephant" id="Elephant">
		Elephant
		</label>
		<label>
			<input type="checkbox" name="Wildebeest" id=Wildebeest>
		Wildebeest
		</label>
		<label>
			<input type="checkbox" name="Pigeon" id="Pigeon">
		Pigeon
		</label>
		<label>
			<input type="checkbox" name="Crab" id="Crab">
		Crab
		</label>
	</fieldset>
	<br>
	<label>
		<input type="SUBMIT" id="SUBMIT">
	</label>
</body>
</html>
