<!DOCTYPE html>
<html>
<head>
	<title>STUDENT REGISTERATION FORM</title>
</head>
<body>
	<main>
		<h1>FORM</h1>
	<form>
		<fieldset>
			<legend>STUDENT REGISTERATION FORM</legend>
			<label>
				FIRST NAME:
				<input type="text" id="FIRST NAME" placeholder="first Name"> (Max of 20 Characters A-Z and a-z)
			</label>
			<br>
			<br>
			<label>
				LAST NAME:
				<input type="text" id="LAST NAME" placeholder="last Name"> (Max of 20 Characters A-Z and a-z)
			</label>
			<br>
			<br>
			<label>
				DATE OF BIRTH:
				<select>
					<option value="">Days</option>
					<option value="01">01</option>
					<option value="02">02</option>
					<option value="03">03</option>
					<option value="04">04</option>
					<option value="05">05</option>
					<option value="06">06</option>
					<option value="07">07</option>
					<option value="08">08</option>
					<option value="09">09</option>
					<option value="10">10</option>

				</select>
	            <select>
					<option value="">Month</option>
					<option value="01">January</option>
					<option value="02">Feburary</option>
					<option value="03">March</option>
					<option value="04">April</option>
					<option value="05">May</option>
					<option value="06">June</option>
					<option value="07">July</option>
					<option value="08">August</option>
					<option value="09">September</option>
					<option value="10">October</option>
					<option value="11">November</option>
					<option value="12">December</option>
				</select>
				<select>
					<option value="">Year</option>
					<option value="01">2000</option>
					<option value="02">2001</option>
					<option value="03">2002</option>
					<option value="04">2003</option>
					<option value="05">2004</option>
					<option value="06">2005</option>
					<option value="07">2006</option>
					<option value="08">2007</option>
					<option value="09">2008</option>
					<option value="10">2009</option>
					<option value="11">2010</option>
					<option value="12">2011</option>
				</select>
            </label>
            <br> 
            <br>
            <label>
            	EMAIL-ID
            	<input type="text" id="EMAIL-ID" placeholder="Email-id">
            </label>
            <br>
            <br>
            <label>
            	PASSWORD:
            	<input type="text" id="PASSWORD" placeholder="Password" required> 
            </label>
            <br>
            <br>
            <label>
            	GENDER:
            	<label>
            	<input type="radio" name="GENDER" id="Male">
            	Male
            	</label>
            	<label>
            	<input type="radio"name="GENDER" id="Female">
            	Female
            	</label>
            </label>
            <br>
            <br>
            <label>
            	ADDRESS:
            	<input type="text" id="ADDRESS">
            </label>
            <br>
            <br>
            <label>
            	PINCODE:
            	<input type="text" id="PINCODE"> 
            </label>
            <br>
            <br>
            <label>
            	STATE:
            	<input type="text" id="STATE" placeholder="state">
            </label>
            <br>
            <br>
            <label>
            	CITY:
            	<input type="text" id="CITY" placeholder="city">
            </label>
            <br>
            <br>
            <label>
            	COUNTRY:
            	<input type="text" id="COUNTRY" placeholder="country">
            </label>
            <br>
            <br>
            <label>
            	HOBBIES:
            	<label>
            		Drawing
            		<input type="checkbox" name="" id="Drawing">        
            	</label>
            	<label>
            		Singing
            	<input type="checkbox" name="" id="Singing">
            	</label>
            	<label> 
            		Dancing
            	<input type="checkbox" name="" id="Dancing">
            	</label>
            	<label>
            		Sketching
            	<input type="checkbox" name="" id="Sketching">
            	</label>
            </label>
            <br>
            <br>
            <label>
            	QUALIFICATION:
            	<br>
            	<table border="1px">
            		<thead>
            			<th>SI.NO</th>
            			<th>EXAMINATION</th>
            			<th>BOARD</th>
            			<th>PERCENTAGE</th>
            			<th>YEAR OF PASSING</th>
            		</thead>
            		<tbody>
            			<tr>
            			<td>1.</td>
            			<td>Computer Science</td>
            			<td>CSE</td>
            			<td>93%</td>
            			<td>2020</td>
            		    </tr>
            		    <tr>
            		    	<td>2.</td>
            		    	<td>Electronics</td>
            			    <td>ECE</td>
            			    <td>95%</td>
            			    <td>2021</td>
            		    </tr>
            		    <tr>
            			   <td>3.</td>
            			   <td>Mechanical</td>
            			   <td>MECH</td>
            			   <td>97%</td>
            			   <td>2022</td>
            			</tr>
            		</tbody>
            	</table>
            	<br>
            	<label>
            		COURSES:
            		<label>
            			BCA
            			<input type="radio" name="COURSES" id="BCA">
            		</label>
            		<label>
            			MCA
            			<input type="radio"name="COURSES" id="MCA">
            		</label>	
            	</label>
            	<br>
		</fieldset>
		<br>
		<label>
            <input type="Submit" id="Submit">
        </label>
	</form>
	</main>
</body>
</html>
